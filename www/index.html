<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>تاجر المدن</title><style>

</style></head><body>
<div id=bw><div id=board><div id=ctr><h1>🏙️ تاجر المدن</h1><div id=dice>⚀⚁</div><div id=msg></div><button id=act style=display:none></button><small id=rd></small></div></div></div>
<div id=side><div id=pls></div><div><select id=spd onchange="sp=+this.value"><option value=800>بطيء<option value=400 selected>عادي<option value=120>سريع<option value=0>فوري</select><button onclick="paused=!paused;this.textContent=paused?'▶️ متابعة':'⏸️ إيقاف'">⏸️ إيقاف</button><button onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">🔊</button><button onclick=openMine()>🏘️ أملاكي</button><button onclick=openTrade()>🤝 تبادل</button><button onclick=setup()>🆕 لعبة جديدة</button></div><div id=log></div></div>
<div id=MW><div id=M></div></div>
<script>
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),shuf=a=>a.sort(()=>Math.random()-.5);
/* ===== بيانات ===== */
const GC=['#8b5a2b','#8fd3f4','#e75480','#f28c28','#d62828','#f7d117','#2e9e4f','#1d4ed8'],HC=[50,50,100,100,150,150,200,200],GR=[0,1,2,3,4,5,6,7];
const ICON={g:'➡️',j:'⛓️',f:'🅿️',k:'🚔',c:'📦',h:'❓',x:'💰',s:'🚂',u:'💡'};
const S=`البداية|g;القصبة|p|60|0;صندوق المجتمع|c;باب الزوار|p|60|0;ضريبة الدخل|x|200;محطة الجزائر|s|200;بجاية|p|100|1;الحظ|h;جيجل|p|100|1;سكيكدة|p|120|1;السجن (زيارة)|j;عنابة|p|140|2;شركة الكهرباء|u|150;سطيف|p|140|2;باتنة|p|160|2;محطة وهران|s|200;تلمسان|p|180|3;صندوق المجتمع|c;مستغانم|p|180|3;معسكر|p|200|3;موقف مجاني|f;وهران|p|220|4;الحظ|h;قسنطينة|p|220|4;البليدة|p|240|4;محطة قسنطينة|s|200;غرداية|p|260|5;ورقلة|p|260|5;شركة المياه|u|150;بسكرة|p|280|5;اذهب إلى السجن|k;تيزي وزو|p|300|6;بومرداس|p|300|6;صندوق المجتمع|c;الأغواط|p|320|6;محطة عنابة|s|200;الحظ|h;العاصمة|p|350|7;ضريبة الرفاهية|x|100;حيدرة|p|400|7`.split(';').map((x,i)=>{const[n,t,pr,g]=x.split('|'),s={i,n,t,pr:+pr||0,g:g===undefined?-1:+g};if(t==='p'){const b=s.pr<350?(s.pr-40)/10:s.pr<400?35:50;s.r=[b,5*b,15*b,45*b,80*b,125*b]}return s});
const CH=[['تقدّم إلى البداية وخذ 200','G',0],['سافر إلى وهران','G',21],['تقدّم إلى حيدرة','G',39],['تقدّم إلى سطيف','G',13],['اذهب إلى محطة الجزائر','G',5],['تقدّم إلى أقرب محطة، والمالك ياخذ ضعف الإيجار','S'],['تقدّم إلى أقرب شركة وادفع 10× النرد','U'],['البنك يمنحك أرباحاً: 50','M',50],['بطاقة الخروج من السجن','F'],['ارجع 3 خانات','B'],['اذهب مباشرة إلى السجن','J'],['إصلاح العمارات: 25 لكل بيت و100 لكل فندق','R',25,100],['غرامة سرعة: ادفع 15','M',-15],['انتُخبت رئيس الجمعية: ادفع 50 لكل لاعب','A',-50],['قرض البناء ينضج: خذ 150','M',150],['ربحت مسابقة الإذاعة: 100','M',100]];
const CC=[['خطأ بنكي لصالحك: 200','M',200],['أتعاب الطبيب: ادفع 50','M',-50],['بعت محصول التمور: 45','M',45],['بطاقة الخروج من السجن','F'],['اذهب مباشرة إلى السجن','J'],['عيد ميلادك: كل لاعب يعطيك 10','A',10],['استرداد الضريبة: 20','M',20],['مكافأة العيد: 100','M',100],['مصاريف المستشفى: ادفع 100','M',-100],['رسوم المدرسة: ادفع 50','M',-50],['ورثة من عمّ بعيد: 100','M',100],['تصليح السيارة: 40 لكل بيت و115 لكل فندق','R',40,115],['التأمين ينضج: 100','M',100],['فزت بأحسن كسكسي في الحي: 25','M',25],['تبرعت للحي: ادفع 30','M',-30],['تقدّم إلى البداية','G',0]];
const CARDS={c:CC,h:CH};
const PS=[['عنتر','agg','العدواني','🦁'],['الحاج سعيد','cau','الحذر','🐢'],['نسرين','col','جامعة المجموعات','🧩'],['كريم','stn','عاشق المحطات','🚂'],['ياسين','spc','المضارب','🏨'],['عمر','bal','المتوازن','⚖️'],['فرطاس','rnd','العشوائي','🎲']];
const COL=['#e63946','#2a9d8f','#f4a261','#6a4c93','#1d3557','#8ab17d','#c9a227','#ff6fb5'];
/* ===== الحالة ===== */
let G,gid=0,sp=400,mute=false,paused=false,AC,MG=null,TRb=0;
/* ===== دوال القواعد ===== */
const grp=g=>S.filter(s=>s.g===g&&s.t==='p'),cnt=(id,t)=>S.filter(s=>s.t===t&&G.o[s.i]===id).length,mono=(id,g)=>grp(g).every(s=>G.o[s.i]===id);
const rc=i=>i<=10?[10,10-i]:i<20?[20-i,0]:i<=30?[0,i-20]:[i-30,10];
const un=()=>S.filter(s=>'psu'.includes(s.t)&&G.o[s.i]<0).length;
const canB=(p,i)=>{const s=S[i];if(s.t!=='p'||!mono(p.id,s.g))return 0;const g=grp(s.g);return !g.some(x=>G.m[x.i])&&G.h[i]<5&&G.h[i]===Math.min(...g.map(x=>G.h[x.i]))&&p.c>=HC[s.g]};
const canS=i=>{const s=S[i];return s.t==='p'&&G.h[i]>0&&G.h[i]===Math.max(...grp(s.g).map(x=>G.h[x.i]))};
const canM=i=>{const s=S[i];return !G.m[i]&&(s.t!=='p'||grp(s.g).every(x=>!G.h[x.i]))};
function rent(i,d){const s=S[i],o=G.o[i];if(s.t==='s')return 25<<(cnt(o,'s')-1);if(s.t==='u')return d*(cnt(o,'u')===2?10:4);if(G.h[i])return s.r[G.h[i]];return s.r[0]*(mono(o,s.g)?2:1)}
function nw(p){return p.c+S.reduce((a,s)=>G.o[s.i]===p.id?a+(G.m[s.i]?s.pr/2:s.pr)+G.h[s.i]*(HC[s.g]||0)/2:a,0)}
async function pay(p,a,to){while(p.c<a){if(!await raise(p,a)){await bankrupt(p,to);return false}}p.c-=a;if(to>=0)G.p[to].c+=a;snd(200,.05);ui();return true}
async function raise(p,a){if(p.h){await manage(p,a);return p.c>=a}return liq(p)}
function liq(p){const mine=S.filter(s=>G.o[s.i]===p.id);let s=mine.filter(s=>canS(s.i)).sort((a,b)=>G.h[b.i]-G.h[a.i])[0];if(s){G.h[s.i]--;p.c+=HC[s.g]/2;log(`${p.n} باع بيتاً في ${s.n}`);return true}
 s=mine.filter(s=>canM(s.i)).sort((a,b)=>a.pr-b.pr)[0];if(s){G.m[s.i]=1;p.c+=s.pr/2;log(`${p.n} رهن ${s.n}`);return true}return false}
async function bankrupt(p,to){log(`💥 ${p.n} أفلس!`);snd(120,.4);const lst=S.filter(s=>G.o[s.i]===p.id);
 lst.forEach(s=>{if(G.h[s.i]){p.c+=G.h[s.i]*HC[s.g]/2;G.h[s.i]=0}});p.bk=1;
 if(to>=0){const q=G.p[to];q.c+=Math.max(0,p.c);q.j.push(...p.j);lst.forEach(s=>G.o[s.i]=to)}
 else{p.j.forEach(([t,k])=>G[t==='c'?'dc':'dh'].push(k));lst.forEach(s=>{G.o[s.i]=-1;G.m[s.i]=0})}
 p.c=0;p.j=[];ui();if(to<0)for(const s of lst)await auction(s.i)}
async function auction(i){const s=S[i];let act=G.p.filter(p=>!p.bk),bid=0,hi=null,k=0,n=0;log(`🔨 مزاد على ${s.n}`);
 while((act.length>1||(act.length===1&&!hi))&&n++<500){const p=act[k%act.length];if(hi===p){k++;continue}
  const nb=bid+(bid<100?10:bid<400?20:50);let ok=false;
  if(p.h){const r=await modal(`<h3>🔨 مزاد: ${s.n}</h3><p>السعر الأصلي ${s.pr} — أعلى عرض: ${bid} ${hi?'('+hi.n+')':''}<br>رصيدك ${p.c}</p>`,[[`زايد ${nb}`,1],[`ارفع إلى ${bid+100}`,2],['انسحب',0]]);
   if(r===1&&p.c>=nb){bid=nb;hi=p;ok=true}else if(r===2&&p.c>=bid+100){bid+=100;hi=p;ok=true}}
  else if(nb<=Math.min(val(p,i),p.c-res(p)*.5)){bid=nb;hi=p;ok=true;await sl(.15)}
  if(ok)k++;else act.splice(act.indexOf(p),1)}
 if(hi){hi.c-=bid;G.o[i]=hi.id;log(`🔨 ${hi.n} ربح ${s.n} بـ${bid}`);snd(700,.1)}else log(`${s.n} بقي بدون مشتري`);ui()}
function build(p,i){p.c-=HC[S[i].g];G.h[i]++;log(`🏗️ ${p.n} بنى في ${S[i].n}`);snd(500,.06)}
/* ===== الذكاء الاصطناعي ===== */
const res=p=>({agg:50,cau:350,col:150,stn:150,spc:60,bal:200,rnd:120})[p.ps];
function val(p,i){const s=S[i];let v=s.pr;
 if(s.t==='p'){const g=grp(s.g),mi=g.filter(x=>G.o[x.i]===p.id).length;v*=mi===g.length-1?1.8:1+.25*mi;
  if(g.some(x=>G.o[x.i]>=0&&G.o[x.i]!==p.id&&g.filter(y=>G.o[y.i]===G.o[x.i]).length===g.length-1))v*=1.4;
  if(p.ps==='col')v*=1.2;if(p.ps==='spc')v*=s.g>=3?1.2:.9;if(p.ps==='stn')v*=.85}
 else{v*=1+.25*cnt(p.id,s.t);if(p.ps==='stn')v*=1.6}
 v*={agg:1.35,cau:.8,rnd:.6+Math.random()*.9}[p.ps]||1;
 return v*(G.d==='easy'?.7+Math.random()*.4:G.d==='hard'?1.1:1)}
async function bm(p){for(const s of S)if(G.o[s.i]===p.id&&G.m[s.i]&&p.c>res(p)+s.pr*.55){p.c-=Math.round(s.pr*.55);G.m[s.i]=0;log(`${p.n} فكّ رهن ${s.n}`)}
 let n=0;for(const g of GR)if(mono(p.id,g))while(n<6){const c=grp(g).filter(x=>canB(p,x.i)).sort((a,b)=>G.h[a.i]-G.h[b.i])[0];if(!c||p.c-HC[g]<res(p)+(p.ps==='cau'?150:0))break;build(p,c.i);n++}ui()}
const bj=p=>p.j.length?2:(p.c>400&&un()>8?1:3);
function tv(b,i,get,o){const s=S[i];let v=get?val(b,i):s.pr*(1+.3*(s.t==='p'?grp(s.g).filter(x=>G.o[x.i]===b.id).length:cnt(b.id,s.t)));
 if(!get&&s.t==='p'){const g=grp(s.g);if(g.filter(x=>G.o[x.i]===o.id).length===g.length-1)v+=s.pr*2.2}return v*(G.m[i]?.7:1)}
/* ===== سير اللعب ===== */
const sleep=async ms=>{const g=gid;await new Promise(r=>setTimeout(r,ms));while(paused)await new Promise(r=>setTimeout(r,120));if(g!==gid)throw 0},sl=(k=1)=>sleep(sp*k);
async function game(){const g=gid;try{while(!G.over){for(const p of G.p){if(p.bk)continue;try{await turn(p)}catch(e){if(e===0)throw e;console.error(e)}
  if(G.p.filter(q=>!q.bk).length<2)return fin()}G.r++;$('rd').textContent='الجولة '+G.r;if(G.r>(G.mr||600))return fin()}}catch(e){if(e!==0)console.error(e)}}
async function turn(p){G.cur=p.id;ui();let dc=0;
 for(;;){if(p.h)await wb(p.jl?'⛓️ دورك':dc?'🎲 ارمِ مجدداً':'🎲 ارمِ النرد');else{await bm(p);await sl(.7)}
  if(p.jl&&await jail(p)!==1)return;
  const[a,b]=await roll();log(`${p.n} رمى ${a}+${b}`);
  if(a===b){if(++dc===3){log(`${p.n}: 3 مضاعفات → السجن 🚔`);await toJail(p);return}}else dc=0;
  await mv(p,a+b);await land(p,a+b);if(p.bk||p.jl)return;
  if(a===b){log(`${p.n} دور إضافي (مضاعف)`);continue}
  if(p.h)await wb('✅ إنهاء الدور');return}}
async function jail(p){let ch;
 if(p.h){const bt=[];if(p.c>=50)bt.push(['ادفع 50',1]);if(p.j.length)bt.push(['استعمل بطاقة الخروج',2]);bt.push(['حاول رمي مضاعف',3]);ch=await modal(`<h3>⛓️ أنت في السجن</h3><p>المحاولة ${p.jt+1} من 3</p>`,bt)}else ch=bj(p);
 if(ch===2){const[t,k]=p.j.pop();G[t==='c'?'dc':'dh'].push(k);p.jl=0;log(`${p.n} استعمل بطاقة الخروج 🔓`);return 1}
 if(ch===1){log(`${p.n} دفع 50 وخرج`);if(!await pay(p,50,-1))return 0;p.jl=0;return 1}
 const[a,b]=await roll();
 if(a===b){p.jl=0;log(`${p.n} رمى مضاعف وخرج`);await mv(p,a+b);await land(p,a+b);return 2}
 p.jt++;if(p.jt>=3){log(`${p.n} فشل 3 مرات: يدفع 50`);if(!await pay(p,50,-1))return 0;p.jl=0;await mv(p,a+b);await land(p,a+b);return 2}
 log(`${p.n} باقي في السجن`);return 0}
async function roll(){const F='⚀⚁⚂⚃⚄⚅',d=$('dice');snd(300,.1);if(sp){d.classList.add('rl');for(let i=0;i<4;i++){d.textContent=F[rnd(6)]+F[rnd(6)];await sleep(sp*.12)}d.classList.remove('rl')}const a=rnd(6),b=rnd(6);d.textContent=F[a]+F[b];return[a+1,b+1]}
async function step(p){p.pos=(p.pos+1)%40;if(p.pos===0){p.c+=200;log(`${p.n} مرّ بالبداية +200`);snd(800,.1)}ui();await sleep(sp?Math.max(50,sp*.18):0)}
const mv=async(p,n)=>{for(let i=0;i<n;i++)await step(p)},fwd=async(p,t)=>{while(p.pos!==t)await step(p)};
async function toJail(p){p.pos=10;p.jl=1;p.jt=0;log(`🚔 ${p.n} في السجن`);snd(150,.3);ui();await sl(.5)}
async function land(p,d,x){const i=p.pos,s=S[i];ui();
 if('psu'.includes(s.t)){const o=G.o[i];
  if(o<0){const buy=p.h?await modal(`<h3>🏷️ ${s.n}</h3><p>السعر ${s.pr} — رصيدك ${p.c}</p>`,[...(p.c>=s.pr?[['شراء',1]]:[]),['مزاد',0]]):p.c-s.pr>=res(p)&&val(p,i)>=s.pr*.95;
   if(buy){p.c-=s.pr;G.o[i]=p.id;log(`🏷️ ${p.n} اشترى ${s.n} بـ${s.pr}`);snd(600,.1)}else await auction(i)}
  else if(o!==p.id&&!G.m[i]){const r=x==='U'?d*10:rent(i,d)*(x==='S'?2:1);log(`💸 ${p.n} يدفع ${r} لـ${G.p[o].n} (${s.n})`);await pay(p,r,o)}}
 else if(s.t==='x'){log(`💰 ${p.n} يدفع ${s.n}: ${s.pr}`);await pay(p,s.pr,-1)}
 else if(s.t==='k')await toJail(p);
 else if(s.t==='c'||s.t==='h')await card(p,s.t,d);
 ui();await sl(.4)}
async function card(p,t,d){const dk=G[t==='c'?'dc':'dh'],k=dk.shift(),[tx,cd,a,b]=CARDS[t][k];if(cd!=='F')dk.push(k);
 if(p.h)await modal(`<h3>${t==='c'?'📦 صندوق المجتمع':'❓ الحظ'}</h3><p style=font-size:1.2em>${tx}</p>`,[['حسناً',1]]);else{log(`🃏 ${p.n}: ${tx}`);await sl(.8)}
 if(cd==='M'){if(a>0){p.c+=a;snd(700,.1)}else await pay(p,-a,-1)}
 else if(cd==='G'){await fwd(p,a);await land(p,d)}
 else if(cd==='J')await toJail(p);
 else if(cd==='F')p.j.push([t,k]);
 else if(cd==='B'){p.pos=(p.pos+37)%40;ui();await land(p,d)}
 else if(cd==='S'||cd==='U'){const L=cd==='S'?[5,15,25,35]:[12,28];await fwd(p,L.find(z=>z>p.pos)??L[0]);await land(p,d,cd)}
 else if(cd==='R'){let c=0;S.forEach(s=>{if(G.o[s.i]===p.id)c+=G.h[s.i]===5?b:G.h[s.i]*a});if(c)await pay(p,c,-1)}
 else if(cd==='A'){for(const q of G.p){if(q===p||q.bk||p.bk)continue;if(a>0)await pay(q,a,p.id);else await pay(p,-a,q.id)}}}
function fin(){G.over=1;const al=G.p.filter(p=>!p.bk).sort((a,b)=>nw(b)-nw(a));
 show(`<h3>🏆 انتهت اللعبة</h3><p>${al.length===1?'آخر لاعب باقٍ':'الأعلى ثروة'}: <b>${al[0].sym} ${al[0].n}</b></p>`+al.map(p=>`<div>${p.sym} ${p.n}: ${Math.round(nw(p))}</div>`).join('')+'<div class=bt><button onclick=setup()>لعبة جديدة</button></div>')}
/* ===== واجهة ===== */
function snd(f,d=.08){if(mute)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function log(t){G.log.unshift(t);$('log').innerHTML=G.log.slice(0,80).map(x=>'<div>'+x+'</div>').join('');$('msg').textContent=t}
const show=h=>{$('M').innerHTML=h;$('MW').style.display='flex'},hide=()=>$('MW').style.display='none';
function modal(html,btns){return new Promise(r=>{show(html+'<div class=bt>'+btns.map((b,i)=>`<button data-i=${i}>${b[0]}</button>`).join('')+'</div>');$('M').querySelectorAll('.bt button').forEach(b=>b.onclick=()=>{hide();r(btns[b.dataset.i][1])})})}
function wb(l){return new Promise(r=>{G.free=1;const b=$('act');b.textContent=l;b.style.display='';b.onclick=()=>{G.free=0;b.style.display='none';r()}})}
function ui(){if(!G)return;$('pls').innerHTML=G.p.map(p=>`<div class="pl ${G.cur===p.id?'cur':''} ${p.bk?'bk':''}" style="border-color:${p.col}">${p.sym} <b>${p.n}</b> <small>${p.lb||''}</small><br>💰${p.c} · 🏷️${S.filter(s=>G.o[s.i]===p.id).length} ${p.jl?'⛓️':''}${p.j.length?'🔑':''}${p.bk?' مفلس':''}</div>`).join('');
 G.p.forEach(p=>{const t=$('t'+p.id),[r,c]=rc(p.pos);t.style.display=p.bk?'none':'flex';t.style.left=(c*9.0909+.5+(p.id%3)*2.9)+'%';t.style.top=(r*9.0909+3+Math.floor(p.id/3)*2.9)+'%'});
 S.forEach(s=>{const c=$('c'+s.i),o=G.o[s.i];c.style.boxShadow=o>=0?`inset 0 0 0 3px ${G.p[o].col}`:'';c.style.opacity=G.m[s.i]?.45:1;if(s.t==='p')c.firstChild.textContent=G.h[s.i]===5?'🏨':'🏠'.repeat(G.h[s.i])})}
/* أملاكي */
const manage=(p,need)=>new Promise(r=>{MG={p,need,r};rm()});
function rm(){const{p,need}=MG;let h=`<h3>🏘️ أملاكي — رصيدك ${p.c}${need?` <b style=color:#c22>(مطلوب ${need})</b>`:''}</h3>`;const ms=S.filter(s=>G.o[s.i]===p.id);if(!ms.length)h+='<p>ما عندك أملاك.</p>';
 ms.forEach(s=>{const i=s.i,t=s.t==='p',u=Math.round(s.pr*.55);h+=`<div class=row><span class=dot style="background:${t?GC[s.g]:'#888'}"></span>${s.n} ${G.m[i]?'🔒':''}${G.h[i]===5?'🏨':'🏠'.repeat(G.h[i])}`
 +(canB(p,i)?`<button onclick="mg('b',${i})">بناء ${HC[s.g]}</button>`:'')+(canS(i)?`<button onclick="mg('s',${i})">بيع +${HC[s.g]/2}</button>`:'')
 +(canM(i)?`<button onclick="mg('m',${i})">رهن +${s.pr/2}</button>`:'')+(G.m[i]&&p.c>=u?`<button onclick="mg('u',${i})">فك الرهن ${u}</button>`:'')+'</div>'});
 h+='<div class=bt>'+(p.c>=need?'<button onclick="mgx(1)">إغلاق</button>':'')+(need&&p.c<need?'<button style=background:#a22 onclick="mgx(0)">إعلان الإفلاس</button>':'')+'</div>';show(h)}
function mg(o,i){const p=MG.p,s=S[i];if(o==='b'&&canB(p,i)){p.c-=HC[s.g];G.h[i]++}else if(o==='s'&&canS(i)){p.c+=HC[s.g]/2;G.h[i]--}else if(o==='m'&&canM(i)){p.c+=s.pr/2;G.m[i]=1}else if(o==='u'){const c=Math.round(s.pr*.55);if(p.c>=c){p.c-=c;G.m[i]=0}}ui();rm()}
function mgx(v){hide();const r=MG.r;MG=null;r(v)}
const idle=()=>G&&G.free&&!MG&&$('MW').style.display!=='flex'&&!G.p[0].bk;
function openMine(){if(idle())manage(G.p[0],0)}
/* التبادل */
function openTrade(){if(!idle())return;const b=G.p.find(p=>!p.h&&!p.bk);if(!b)return;TRb=b.id;rt()}
function rt(){const me=G.p[0],bt=G.p[TRb];const L=(p,k)=>S.filter(s=>G.o[s.i]===p.id&&!(s.t==='p'&&grp(s.g).some(x=>G.h[x.i]))).map(s=>`<label><input type=checkbox class=${k} value=${s.i}>${s.n}${G.m[s.i]?'🔒':''}</label>`).join('')||'—';
 show(`<h3>🤝 تبادل مع <select onchange="TRb=+this.value;rt()">${G.p.filter(p=>!p.h&&!p.bk).map(p=>`<option value=${p.id} ${p.id===TRb?'selected':''}>${p.n}</option>`).join('')}</select></h3><div class=cols><div><b>تعطيه</b>${L(me,'ga')}<label>مال <input id=ca type=number min=0 value=0 style=width:70px></label><label><input type=checkbox id=ja ${me.j.length?'':'disabled'}>بطاقة سجن</label></div><div><b>تاخذ منه</b>${L(bt,'gb')}<label>مال <input id=cb type=number min=0 value=0 style=width:70px></label><label><input type=checkbox id=jb ${bt.j.length?'':'disabled'}>بطاقة سجن</label></div></div><p id=tm></p><div class=bt><button onclick=tgo()>اقترح الصفقة</button><button onclick=hide()>إلغاء</button></div>`)}
function tgo(){const me=G.p[0],b=G.p[TRb],q=s=>[...document.querySelectorAll(s)].map(x=>+x.value),A=q('.ga:checked'),B=q('.gb:checked'),ca=+$('ca').value||0,cb=+$('cb').value||0,ja=$('ja').checked,jb=$('jb').checked;
 if(ca>me.c||cb>b.c){$('tm').textContent='المبلغ أكبر من الرصيد المتاح';return}if(!A.length&&!B.length&&!ca&&!cb&&!ja&&!jb)return;
 let g=ca-cb+(ja?40:0)-(jb?40:0);A.forEach(i=>g+=tv(b,i,1));B.forEach(i=>g-=tv(b,i,0,me));
 const m={easy:-80,normal:25,hard:90}[G.d]+(b.ps==='cau'?40:0)+(b.ps==='rnd'?rnd(80)-40:0);
 if(g<m){$('tm').textContent=`❌ ${b.n} رفض: العرض ما يغطيش القيمة`;return}
 A.forEach(i=>G.o[i]=b.id);B.forEach(i=>G.o[i]=0);me.c+=cb-ca;b.c+=ca-cb;
 if(ja)b.j.push(me.j.pop());if(jb)me.j.push(b.j.pop());log(`🤝 ${b.n} قبل الصفقة مع ${me.n}`);hide();ui()}
/* بدء */
function setup(){show(`<h3>🏙️ تاجر المدن — لعبة جديدة</h3><label>اسمك <input id=sn value="أنا"></label><br><label>عدد البوتات (1-7) <input id=sb type=number min=1 max=7 value=7 style=width:60px></label><br><label>رأس المال <input id=sc type=number value=1500 style=width:80px></label><br><label>الصعوبة <select id=sd><option value=easy>سهل<option value=normal selected>عادي<option value=hard>صعب</select></label><br><label>أقصى عدد جولات (0 = بلا حد) <input id=sr type=number value=0 style=width:60px></label><div class=bt><button onclick=startGame()>ابدأ</button></div>`)}
function startGame(){const n=Math.min(7,Math.max(1,+$('sb').value||7)),c=+$('sc').value||1500,mk=(id,n,h,sym,ps,lb)=>({id,n,h,c,sym,ps,lb,pos:0,jl:0,jt:0,j:[],bk:0,col:COL[id]});
 const nm=$('sn').value||'أنا',d=$('sd').value,mr=+$('sr').value||0;hide();gid++;paused=false;$('act').style.display='none';
 G={o:Array(40).fill(-1),h:Array(40).fill(0),m:Array(40).fill(0),p:[],log:[],r:1,cur:0,free:0,d,mr,dc:shuf([...Array(16).keys()]),dh:shuf([...Array(16).keys()])};MG=null;
 G.p.push(mk(0,nm,1,'🧑','','أنت'));for(let k=0;k<n;k++){const q=PS[k];G.p.push(mk(k+1,q[0],0,q[3],q[1],q[2]))}
 document.querySelectorAll('.t').forEach(e=>e.remove());G.p.forEach(p=>{const t=document.createElement('div');t.className='t';t.id='t'+p.id;t.style.background=p.col;t.textContent=p.sym;$('board').appendChild(t)});
 $('log').innerHTML='';$('rd').textContent='الجولة 1';ui();log('🎮 بدأت اللعبة!');game()}
S.forEach(s=>{const[r,c]=rc(s.i),d=document.createElement('div');d.className='c';d.id='c'+s.i;d.style.left=c*9.0909+'%';d.style.top=r*9.0909+'%';
 d.innerHTML=`<div class=b style="background:${s.g>=0?GC[s.g]:'none'}">${s.g>=0?'':s.i===28?'🚰':ICON[s.t]}</div><div class=n>${s.n}</div><div class=p>${s.pr||''}</div>`;$('board').appendChild(d)});
$('board').onclick=()=>{if(innerWidth<700)document.body.classList.toggle('big')};
setup();
</script></body></html>
