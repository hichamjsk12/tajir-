const SPD=[[800,'🐢'],[400,'🚶'],[120,'🏃'],[0,'⚡']];let si=CFG.si??1;sp=SPD[si][0];
function tgSpd(){si=(si+1)%4;sp=SPD[si][0];CFG.si=si;saveCfg();$('bs').textContent=SPD[si][1]}
function fsTry(){try{const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}}
function tgFs(){try{if(document.fullscreenElement)document.exitFullscreen();else fsTry()}catch(e){}}

function cancelSetup(){closeSetup();hide();setPause(false)}
/* أملاكي */
const manage=(p,need)=>new Promise(r=>{MG={p,need,r};rm()});
function rm(){const{p,need}=MG;let h=`<h3>${hd(p)} 🏘️ 💰${p.c}${need?` <b style=color:#c22>(${tt('مطلوب','requis','need')} ${need})</b>`:''}</h3>`;const ms=S.filter(s=>G.o[s.i]===p.id);if(!ms.length)h+=tt('<p>ما عندك أملاك.</p>','<p>Vous n\'avez aucune propriété.</p>','<p>You own no properties.</p>');
 ms.forEach(s=>{const i=s.i,t=s.t==='p',u=Math.round(s.pr*.55);h+=`<div class=row><span class=dot style="background:${t?GC[s.g]:'#888'}"></span>${s.n} ${G.m[i]?'🔒':''}${G.h[i]===5?'🏨':'🏠'.repeat(G.h[i])}`
 +(canB(p,i)?`<button onclick="mg('b',${i})">🏗️ ${HC[s.g]}</button>`:'')+(canS(i)?`<button onclick="mg('s',${i})">💵 +${HC[s.g]/2}</button>`:'')
 +(canM(i)?`<button onclick="mg('m',${i})">🔒 +${s.pr/2}</button>`:'')+(G.m[i]&&p.c>=u?`<button onclick="mg('u',${i})">🔓 ${u}</button>`:'')+'</div>'});
 h+='<div class=bt>'+(p.c>=need?'<button onclick="mgx(1)">✖</button>':'')+(need&&p.c<need?'<button style=background:#a22 onclick="mgx(0)">🏳️ '+tt('إفلاس','Faillite','Bankrupt')+'</button>':'')+'</div>';show(h)}
function mg(o,i){const p=MG.p,s=S[i];if(o==='b'&&canB(p,i)){p.c-=HC[s.g];G.h[i]++;p.st.built++}else if(o==='s'&&canS(i)){p.c+=HC[s.g]/2;G.h[i]--}else if(o==='m'&&canM(i)){p.c+=s.pr/2;G.m[i]=1}else if(o==='u'){const c=Math.round(s.pr*.55);if(p.c>=c){p.c-=c;G.m[i]=0}}ui();rm()}
function mgx(v){hide();const r=MG.r;MG=null;r(v)}
const cur=()=>G.p[G.cur];
const idle=()=>G&&G.free&&!MG&&$('MW').style.display!=='flex'&&!cur().bk;
function openMine(){if(idle())manage(cur(),0)}
/* التبادل */
function openTrade(){if(!idle())return;const o=G.p.find(p=>p!==cur()&&!p.bk);if(!o)return;TRb=o.id;rt()}
function rt(){const me=cur(),bt=G.p[TRb];const L=(p,k)=>S.filter(s=>G.o[s.i]===p.id&&!(s.t==='p'&&grp(s.g).some(x=>G.h[x.i]))).map(s=>`<label><input type=checkbox class=${k} value=${s.i}>${s.n}${G.m[s.i]?'🔒':''}</label>`).join('')||'—';
 show(`<h3>${hd(me)} 🤝 <select onchange="TRb=+this.value;rt()">${G.p.filter(p=>p!==me&&!p.bk).map(p=>`<option value=${p.id} ${p.id===TRb?'selected':''}>${p.sym} ${p.n}</option>`).join('')}</select></h3><div class=cols><div><b>${tt('تعطي ➡️','Vous donnez ➡️','You give ➡️')}</b>${L(me,'ga')}<label>💰 <input id=ca type=number min=0 value=0 style=width:70px></label><label><input type=checkbox id=ja ${me.j.length?'':'disabled'}>🔑</label></div><div><b>${tt('⬅️ تأخذ','⬅️ Vous recevez','⬅️ You get')}</b>${L(bt,'gb')}<label>💰 <input id=cb type=number min=0 value=0 style=width:70px></label><label><input type=checkbox id=jb ${bt.j.length?'':'disabled'}>🔑</label></div></div><p id=tm></p><div class=bt><button onclick=tgo()>✅</button><button class=gr onclick=hide()>✖</button></div>`)}
async function tgo(){const me=cur(),b=G.p[TRb],q=s=>[...document.querySelectorAll(s)].map(x=>+x.value),A=q('.ga:checked'),B=q('.gb:checked'),ca=+$('ca').value||0,cb=+$('cb').value||0,ja=$('ja').checked,jb=$('jb').checked;
 if(ca>me.c||cb>b.c){$('tm').textContent=tt('⚠️ المبلغ أكبر من الرصيد المتاح','⚠️ Montant supérieur au solde','⚠️ Amount exceeds balance');return}if(!A.length&&!B.length&&!ca&&!cb&&!ja&&!jb)return;
 if(b.h){const nm=a=>a.map(i=>S[i].n).join(tt('، ',', ',', '))||'—';
  const r=await modal(`<h3>${hd(b)} 🤝 ${hd(me)}</h3>${tt(`<p>أنت تعطي ➡️ ${nm(B)}${cb?' 💰'+cb:''}${jb?' 🔑':''}</p><p>وتأخذ ⬅️ ${nm(A)}${ca?' 💰'+ca:''}${ja?' 🔑':''}</p>`,`<p>Vous donnez ➡️ ${nm(B)}${cb?' 💰'+cb:''}${jb?' 🔑':''}</p><p>et recevez ⬅️ ${nm(A)}${ca?' 💰'+ca:''}${ja?' 🔑':''}</p>`,`<p>You give ➡️ ${nm(B)}${cb?' 💰'+cb:''}${jb?' 🔑':''}</p><p>and get ⬅️ ${nm(A)}${ca?' 💰'+ca:''}${ja?' 🔑':''}</p>`)}`,[['✅',1],['❌',0]]);
  if(!r){log(tt(`❌ ${b.n} رفض الصفقة`,`❌ ${b.n} refuse l'échange`,`❌ ${b.n} declined the trade`));return}}
 else{let g=ca-cb+(ja?40:0)-(jb?40:0);A.forEach(i=>g+=tv(b,i,1));B.forEach(i=>g-=tv(b,i,0,me));
  const m=DF[G.d].mg+(b.ps==='cau'?40:0)+(b.ps==='rnd'?rnd(80)-40:0);
  if(g<m){$('tm').textContent=tt(`❌ ${b.n} رفض: العرض ما يغطيش القيمة`,`❌ ${b.n} refuse : offre trop basse`,`❌ ${b.n} declined: offer too low`);return}}
 A.forEach(i=>G.o[i]=b.id);B.forEach(i=>G.o[i]=me.id);me.c+=cb-ca;b.c+=ca-cb;
 if(ja)b.j.push(me.j.pop());if(jb)me.j.push(b.j.pop());me.st.trades++;b.st.trades++;sfx('coin');log(`🤝 ${b.n} ⇄ ${me.n}`);hide();ui()}
/* بدء */
let SU={h:1,b:3,names:[],picks:[],cash:1500,dif:'normal',mr:0};
const HE=['🧑','👩','👨','👧','👦','👴','👵','🧔'];
function closeSetup(){$('SU').style.display='none';document.body.classList.remove('su')}
function setup(){const live=G&&!G.over;if(live)setPause(true);SU.live=!!live;hide();suRender();$('SU').style.display='flex';document.body.classList.add('su')}
function suS(k,d){const v=SU[k]+d;if(k==='h'&&v<1)return;if(k==='b'&&v>7)return;if(v<0||SU.h+SU.b+d>8)return;SU[k]=v;suRender()}
function setLang(l){LANG=l;CFG.lang=l;saveCfg();applyLang();if($('SU').style.display==='flex')suRender()}
function suRender(){const total=SU.h+SU.b,sv=!SU.live&&loadSave();
 const fox=document.querySelector('#FW svg.fox').outerHTML.replace('class="fox"','class="foxs"').replace(/id="(\w+)"/g,'id="s_$1"').replace(/url\(#(\w+)\)/g,'url(#s_$1)');
 const stp=(k,ic,lb)=>`<div class=stp><div class=stl>${ic} ${lb}</div><div class=stc><button ${(k==='h'?SU.h<=1:SU.b<=0)?'disabled':''} onclick="suS('${k}',-1)">−</button><b>${SU[k]}</b><button ${(total>=8||(k==='b'&&SU.b>=7))?'disabled':''} onclick="suS('${k}',1)">+</button></div></div>`;
 let nm='';for(let i=0;i<SU.h;i++)nm+=`<span class=tkr><span class=tkpv id=tkpv${i} onclick="pickTk(${i})" title="${tt('اختر الشكل','Choisir le pion','Pick token')}">${TIC(SU.picks[i]!==undefined?SU.picks[i]:i%10)}</span><input placeholder="${tt('اسم اللاعب','Nom du joueur','Player name')} ${i+1}" value="${(SU.names[i]||'').replace(/"/g,'')}" maxlength=12 oninput="SU.names[${i}]=this.value"></span>`;
 let bots='';if(SU.b){const ef2=[];for(let i=0;i<SU.h;i++)ef2[i]=SU.picks[i]!==undefined?SU.picks[i]:i%10;const fr2=[...Array(10).keys()].filter(x=>!ef2.includes(x));bots=`<div class=sbt>🤖 ${fr2.slice(0,SU.b).map(x=>`<span class=btk>${TIC(x)}</span>`).join('')} <span>${tt('بوتات بأسماء وشخصيات تلقائية — تلعب بالأشكال المتبقية','Bots aux noms et personnalités automatiques — pièces restantes','Bots with automatic names and personalities — leftover tokens')}</span></div>`}
 const dop=(v,a,f,e)=>`<option value=${v} ${SU.dif===v?'selected':''}>${tt(a,f,e)}</option>`;
 $('SU').innerHTML=`<div class=suf>${fox}</div><div class=sup><div class=sut>🏙️ ${tt('تاجر المدن','Marchand des villes','City Merchant')}</div><div class=slg>🌐 ${langBtns(0)}</div>
 <div class=sst>${stp('h','👤',tt('عدد اللاعبين','Joueurs','Players'))}${stp('b','🤖',tt('عدد البوتات','Bots','Bots'))}</div>
 ${SU.h?`<div class=snm ${SU.h>1?'style="grid-template-columns:repeat(2,minmax(0,1fr))"':''}>${nm}</div>`:''}${bots}
 <div class=sop><label>💰 <input type=number value=${SU.cash} onchange="SU.cash=+this.value||1500" style=width:70px></label>${SU.b?`<label>🎯 <select onchange="SU.dif=this.value">${dop('easy','سهل','Facile','Easy')}${dop('normal','عادي','Normal','Normal')}${dop('hard','صعب','Difficile','Hard')}${dop('expert','خبير','Expert','Expert')}</select></label>`:''}<label>🔄 <input type=number min=0 value=${SU.mr} onchange="SU.mr=+this.value||0" style=width:52px></label></div>
 <p id=sw>${total<2?tt('⚠️ أضف بوتًا أو لاعبًا ثانيًا','⚠️ Ajoutez un bot ou un deuxième joueur','⚠️ Add a bot or a second player'):''}</p>
 <div class=sbtn><button class=go ${total<2?'disabled':''} onclick=startGame()>▶️ ${tt('ابدأ اللعب','Jouer','Play')}</button>${sv?`<button onclick=resumeSaved()>⏩ ${tt('متابعة المحفوظة','Reprendre la partie','Continue saved game')}</button>`:''}${SU.live?'<button class=gr onclick=cancelSetup()>✖</button>':''}</div></div>`}
function resumeSaved(){const g=loadSave();if(g){closeSetup();resume(g)}}
function startGame(){const H=SU.h,B=SU.b;if(H+B<2)return;const c=SU.cash||1500,P=[];let k=0;const st=()=>({rent:0,rcv:0,buy:0,built:0,jail:0,dbl:0,go:0,trades:0});
 const eff=[];for(let i=0;i<H;i++)eff[i]=SU.picks[i]!==undefined?SU.picks[i]:i%10;for(let i=0;i<H;i++,k++)P.push({id:k,n:(SU.names[i]||'').trim()||tt('لاعب ','Joueur ','Player ')+(i+1),h:1,c,sym:TIC(eff[i]),ps:'',lb:'',pos:0,jl:0,jt:0,j:[],bk:0,col:COL[k],st:st()});
 const pool=shuf([...PS]).slice(0,B);const free=[...Array(10).keys()].filter(x=>!eff.includes(x));let fi=0;for(let j=0;j<B;j++,k++){const q=pool[j];const ql=psn(q);P.push({id:k,n:ql[0],h:0,c,sym:TIC(free[fi++%free.length]),ps:q[1],lb:ql[1],pos:0,jl:0,jt:0,j:[],bk:0,col:COL[k],st:st()})}
 closeSetup();hide();cp();cc();gid++;setPause(false);ac();fsTry();$('act').style.visibility='hidden';
 G={o:Array(40).fill(-1),h:Array(40).fill(0),m:Array(40).fill(0),p:P,r:1,cur:0,nx:0,free:0,d:SU.b?SU.dif:'normal',mr:SU.mr,big:{a:0},hist:[P.map(()=>c)],dc:shuf([...Array(CC.length).keys()]),dh:shuf([...Array(CH.length).keys()])};MG=null;
 buildBoardUI();$('rd').textContent='🔄1';ui();log(tt('🎮 بدأت اللعبة!','🎮 La partie commence !','🎮 Game on!'));game()}
applyNames();
S.forEach(s=>{const[r,c]=rc(s.i),d=document.createElement('div'),cor=r%10===0&&c%10===0,side=cor?'cc':r===0?'ct':r===10?'cb':c===0?'cl':'cr';
 d.className='c '+side;d.id='c'+s.i;d.style.left=pos(c);d.style.top=pos(r);
 d.style.width=cor||!(r%10===0)?'var(--h)':'var(--w)';d.style.height=cor||r%10===0?'var(--h)':'var(--w)';
 const ic=s.g>=0?'':`<span class=ic>${s.i===28?'🚰':ICON[s.t]}</span>`;
 d.innerHTML=(s.g>=0?`<div class=b style="background:${GC[s.g]}"></div>`:'')+`<div class=m>${ic}<span class=n>${s.n}</span><span class=p>${s.pr||''}</span></div>`;
 d.onclick=()=>showCard(s.i);$('board').appendChild(d)});
const pips=v=>{const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v];return Array.from({length:9},(_,i)=>`<i class="${P.includes(i)?'on'+(v===1?' r':''):''}"></i>`).join('')};
[0,1].forEach(k=>{const d=$('d'+k),f=FACE[k?3:5];d.innerHTML=[1,2,3,4,5,6].map(v=>`<div class="fc f${v}">${pips(v)}</div>`).join('');d.style.transform=`rotateX(${f[0]}deg) rotateY(${f[1]}deg)`;
 $('dw'+k).onclick=()=>{const b=$('act');if(b.style.visibility==='visible')b.click()}});
$('PW').onclick=e=>{if(e.target===$('PW'))cp()};$('CW').onclick=e=>{if(e.target===$('CW'))cc()};
$('bs').textContent=SPD[si][1];
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G&&!G.over&&!paused)setPause(true);if(AC)AC.suspend()}else if(AC&&(CFG.snd||CFG.mus))AC.resume()});
function fitCells(){requestAnimationFrame(()=>S.forEach(s=>{const c=$('c'+s.i);if(!c)return;const n=c.querySelector('.n'),m=c.querySelector('.m');n.style.fontSize='';let fs=parseFloat(getComputedStyle(n).fontSize);for(let k=0;k<14&&n.offsetWidth>m.clientWidth+1&&fs>5.5;k++){fs-=.6;n.style.fontSize=fs+'px'}}))}
function applyLang(){const d=document.documentElement;d.lang=LANG;d.dir=LANG==='ar'?'rtl':'ltr';document.title=tt('تاجر المدن','Marchand des villes','City Merchant');applyNames();
 S.forEach((s,i)=>{const c=$('c'+i);if(c)c.querySelector('.n').textContent=s.n});
 $('dkc').querySelector('span').textContent=tt('صندوق المجتمع','Caisse commune','Community Chest');$('dkh').querySelector('span').textContent='❓'===''?'':tt('الحظ','Chance','Chance');
 document.querySelectorAll('svg text').forEach(t=>{t.textContent=tt('بنك','BANQUE','BANK');t.setAttribute('font-size',LANG==='fr'?8:LANG==='en'?9:11)});
 if(!G)$('msg').textContent='🏙️ '+tt('تاجر المدن','Marchand des villes','City Merchant');fitCells()}
window.addEventListener('resize',fitCells);
applyLang();setup();
